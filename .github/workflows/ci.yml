name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build C reference static library
        run: make lib/libbrotli_cref.a

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

  test:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        go: ["", "oldstable", "stable"]
        tags: ["", "purego"]
        goamd64: [v1]
        include:
          - go: stable
            tags: ""
            goamd64: v3
    name: test (${{ matrix.go || 'go.mod' }}${{ matrix.tags && format(', {0}', matrix.tags) || '' }}${{ matrix.goamd64 == 'v3' && ', v3' || '' }})
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          go-version-file: ${{ matrix.go == '' && 'go.mod' || '' }}

      - name: Build C reference static library
        run: make lib/libbrotli_cref.a

      - name: Test
        env:
          GOAMD64: ${{ matrix.goamd64 }}
        run: go test -tags '${{ matrix.tags }}' ./...
